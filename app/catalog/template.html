<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频摘要 · 知识工作台</title>
<style>
  :root { font: 15px/1.65 "Microsoft YaHei", "PingFang SC", sans-serif; color:#202720; background:#f6f6f0; --line:#dddfd4; --muted:#58635a; --green:#2b5543; --paper:#fffefa; }
  * { box-sizing:border-box; }
  body { margin:0; }
  button,input,select { font:inherit; color:inherit; }
  button,select { cursor:pointer; }
  a { color:var(--green); text-underline-offset:.22em; }
  :focus-visible { outline:3px solid #498368; outline-offset:3px; }
  .shell { max-width:1180px; margin:auto; padding:28px 32px 52px; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:18px; gap:12px; }
  .brand { font-weight:700; }
  .brand span { color:#58635a; font-weight:400; margin-left:10px; }
  .hero { padding:28px 0 23px; }
  h1,h2,p { margin:0; }
  h1 { font-size:clamp(30px,5vw,46px); line-height:1.3; letter-spacing:-.05em; }
  .muted { color:var(--muted); }
  .hero p { margin-top:8px; }
  .layout { display:grid; grid-template-columns:202px minmax(0,1fr); gap:26px; align-items:start; }
  aside { border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--paper); }
  aside h2 { font-size:14px; margin-bottom:10px; }
  #topics { display:grid; gap:3px; }
  #topics button { display:flex; justify-content:space-between; gap:6px; text-align:left; border:0; background:transparent; padding:8px 9px; border-radius:6px; }
  #topics button:hover,#topics button[aria-pressed="true"] { background:#e6eee6; color:#224f3a; }
  .count { color:var(--muted); font-variant-numeric:tabular-nums; }
  .filters { display:grid; grid-template-columns:minmax(180px,1fr) minmax(128px,auto) minmax(120px,auto); gap:10px; }
  .filters label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  input,select { width:100%; border:1px solid #bfc7bb; border-radius:7px; padding:8px 10px; background:var(--paper); min-height:43px; }
  .results-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:17px 0 10px; }
  .results-head h2 { font-size:19px; }
  #cards { display:grid; gap:11px; }
  article { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
  article:hover { border-color:#a7b9aa; }
  .meta { color:var(--muted); font-size:13px; }
  .open-card { display:flex; justify-content:space-between; align-items:baseline; gap:9px; width:100%; padding:0; margin-top:3px; background:none; border:0; text-align:left; }
  .open-card strong { font-size:18px; line-height:1.45; }
  .open-card span { color:var(--green); white-space:nowrap; font-size:13px; }
  .open-card:hover span { text-decoration:underline; }
  .core { margin-top:4px; color:#38463d; }
  .points { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; list-style:none; padding:0; margin:9px 0 0; }
  .points li { background:#f3f4ee; border-radius:6px; padding:6px 8px; line-height:1.45; font-size:13px; }
  .points strong { display:block; color:#244735; font-size:13px; margin-bottom:2px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tag { border:0; border-radius:6px; background:#edf0e7; color:#2e5141; padding:3px 8px; font-size:13px; }
  .tag:hover { background:#dce9de; }
  dialog { border:1px solid var(--line); border-radius:14px; padding:0; width:min(700px,calc(100% - 28px)); max-height:85vh; color:inherit; background:var(--paper); }
  dialog::backdrop { background:#17251fb3; }
  .details { padding:23px; }
  .detail-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .detail-top button { background:#eef0e9; border:0; border-radius:6px; padding:5px 10px; }
  #detail-title { margin:6px 0 9px; font-size:24px; line-height:1.4; }
  #detail-text { margin-top:10px; }
  #detail-points { padding:0; list-style:none; display:grid; gap:8px; margin:13px 0 0; }
  #detail-points li { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:baseline; gap:9px; }
  #detail-points button { background:#e7eee7; color:#224f3a; border:0; border-radius:5px; padding:2px 7px; font-variant-numeric:tabular-nums; }
  #detail-points strong { color:#244735; }
  #clip { display:block; width:auto; max-width:100%; max-height:48vh; margin:13px auto 0; background:#151b17; border-radius:7px; }
  #clip[hidden], #clip-status[hidden] { display:none; }
  #clip-status { margin-top:6px; }
  .actions { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0 7px; }
  .actions a,.actions button { display:inline-block; background:#e7eee7; color:#224f3a; border:0; border-radius:6px; text-decoration:none; padding:6px 10px; }
  #transcript { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  @media(max-width:650px) { .shell { padding:16px 14px 34px; } .layout { grid-template-columns:1fr; gap:14px; } #topics { display:flex; flex-wrap:wrap; } #topics button { gap:7px; } .filters { grid-template-columns:1fr 1fr; } .filters label:first-child { grid-column:1/-1; } header { font-size:13px; } }
  @media(max-width:500px) { .points { grid-template-columns:1fr; gap:4px; } .points strong { display:inline; margin-right:.4em; } }
</style>
<div class="shell">
  <header><div class="brand">知识工作台</div><a id="workflow-link">下载与入库</a></header>
  <section class="hero">
    <h1>视频摘要</h1>
    <p class="muted">已收录 0 条视频</p>
  </section>
  <div class="layout">
    <aside><h2>知识小主题</h2><nav id="topics" aria-label="知识小主题"></nav></aside>
    <main>
      <div class="filters">
        <label>搜索<input id="query" type="search" placeholder="搜索核心内容或小主题"></label>
        <label>主播<select id="creator"><option value="">所有主播</option></select></label>
        <label>发布时间<select id="order"><option value="newest">最新优先</option><option value="oldest">最早优先</option></select></label>
      </div>
      <div class="results-head"><h2 id="active-topic">全部视频</h2><p id="count" class="muted" role="status"></p></div>
      <section id="cards" aria-label="视频摘要"></section>
    </main>
  </div>
</div>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="details">
    <div class="detail-top"><p class="meta" id="detail-meta"></p><button type="button" id="close">关闭</button></div>
    <h2 id="detail-title"></h2>
    <div id="detail-tags" class="tags"></div>
    <p id="detail-text"></p>
    <ul id="detail-points" aria-label="要点和原片时间"></ul>
    <video id="clip" controls playsinline preload="none" hidden></video>
    <p id="clip-status" class="meta" role="status" hidden></p>
    <div class="actions" id="actions"></div>
    <div id="transcript" hidden tabindex="-1"></div>
  </div>
</dialog>
<script id="sources" type="application/json">{}</script>
<script>
const get = id => document.getElementById(id);
const dialog = get("detail");
const clip = get("clip");
let activeTopic = "";

function add(parent, name, text, className) {
  const el = document.createElement(name);
  el.textContent = text;
  if (className) el.className = className;
  parent.append(el);
  return el;
}

function selectTopic(topic) {
  activeTopic = topic;
  if (dialog.open) dialog.close();
  render();
  get("active-topic").scrollIntoView({block:"nearest"});
}

function addTags(container, tags) {
  container.replaceChildren();
  for (const topic of tags) {
    const button = add(container, "button", topics[topic], "tag");
    button.type = "button";
    button.onclick = () => selectTopic(topic);
  }
}

function openDetail(video) {
  get("detail-meta").textContent = video.creator + " · " + video.date;
  get("detail-title").textContent = video.title;
  get("detail-text").textContent = video.detail;
  addTags(get("detail-tags"), video.tags);
  const points = get("detail-points");
  points.replaceChildren();
  for (const [time, label, text] of video.points || []) {
    const item = add(points, "li", "");
    const button = add(item, "button", time);
    button.type = "button";
    button.setAttribute("aria-label", "从 " + time + " 播放本地视频");
    button.onclick = async () => {
      const [minutes, seconds] = time.split(":").map(Number);
      clip.hidden = false;
      const status = get("clip-status");
      status.hidden = false;
      status.textContent = "已定位到 " + time;
      if (!clip.hasAttribute("src")) clip.src = video.local;
      clip.currentTime = minutes * 60 + seconds;
      try { await clip.play(); }
      catch { status.textContent = "无法自动播放，可点击播放器或打开本地视频。"; }
      clip.scrollIntoView({block:"nearest"});
    };
    const note = add(item, "span", "");
    add(note, "strong", label + "　");
    note.append(text);
  }
  const transcript = get("transcript");
  transcript.hidden = true;
  transcript.textContent = "";
  const actions = get("actions");
  actions.replaceChildren();
  if (video.transcript) {
    const button = add(actions, "button", "查看口播稿");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-controls", "transcript");
    button.onclick = () => {
      transcript.hidden = !transcript.hidden;
      button.setAttribute("aria-expanded", String(!transcript.hidden));
      if (!transcript.hidden) {
        transcript.textContent = video.transcript;
        transcript.focus();
      }
    };
    for (const [label, url] of [["播放本地视频", video.local], ["打开抖音原视频", video.url]]) {
      const link = add(actions, "a", label);
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    }
  }
  dialog.showModal();
}

function render() {
  const creator = get("creator").value;
  const terms = get("query").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const base = videos.filter(v => (!creator || v.creator === creator) &&
    terms.every(term => [v.title, v.core, v.detail, ...(v.points || []).flat(), ...v.tags.map(tag => topics[tag])].join(" ").toLowerCase().includes(term)));
  const nav = get("topics");
  nav.replaceChildren();
  for (const [id, label] of [["", "全部视频"], ...Object.entries(topics)]) {
    const count = id ? base.filter(video => video.tags.includes(id)).length : base.length;
    if (!count && id && id !== activeTopic) continue;
    const button = add(nav, "button", "");
    button.type = "button";
    button.setAttribute("aria-pressed", String(id === activeTopic));
    add(button, "span", label);
    add(button, "span", count, "count");
    button.onclick = () => selectTopic(id);
  }
  const sign = get("order").value === "oldest" ? 1 : -1;
  const shown = base.filter(video => !activeTopic || video.tags.includes(activeTopic))
    .sort((a, b) => sign * a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  get("active-topic").textContent = topics[activeTopic] || "全部视频";
  get("count").textContent = shown.length + " 条";
  const cards = get("cards");
  cards.replaceChildren();
  if (!shown.length) add(cards, "p", "当前筛选没有视频。", "muted");
  for (const video of shown) {
    const row = add(cards, "article", "");
    row.dataset.id = video.id;
    add(row, "p", video.creator + " · " + video.date, "meta");
    const button = add(row, "button", "", "open-card");
    button.type = "button";
    add(button, "strong", video.title);
    add(button, "span", "查看详情 ›");
    button.onclick = () => openDetail(video);
    add(row, "p", video.core, "core");
    if (video.points) {
      const list = add(row, "ul", "", "points");
      for (const [, label, text] of video.points) {
        const item = add(list, "li", "");
        add(item, "strong", label);
        item.append(text);
      }
    }
    addTags(add(row, "div", "", "tags"), video.tags);
  }
}

get("close").onclick = () => dialog.close();
dialog.addEventListener("close", () => {
  clip.pause();
  clip.removeAttribute("src");
  clip.load();
  clip.hidden = true;
  get("clip-status").hidden = true;
});
get("query").addEventListener("input", render);
for (const id of ["creator", "order"]) get(id).addEventListener("change", render);
render();
</script>
