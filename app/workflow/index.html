<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载与入库 · 知识工作台</title>
<link rel="stylesheet" href="/workflow/style.css">
<script src="/workflow/app.js" defer></script>
</head>
<body>
<main>
<header><div><p>个人知识工作台</p><h1>下载与入库</h1></div><a id="library">返回摘要目录</a></header>
<p id="notice" role="status" hidden></p>
<div class="layout">
<section class="panel">
<h2>选择视频</h2>
<div class="stack">
<form id="search-form" class="input-row"><label>搜索抖音主播<input id="keyword" required maxlength="80" placeholder="输入主播名称或抖音号"></label><button>搜索</button></form>
<div id="creators" class="stack" hidden></div>
<form id="profile-form" class="input-row"><label>主播主页链接<input id="profile" required placeholder="粘贴抖音主页链接或分享内容"></label><button>加载作品</button></form>
<details>
<summary>从清单或本地视频导入</summary>
<div class="stack alternatives">
<form id="cache-form" class="input-row"><label>已收录的抖音号<input id="cached" required placeholder="输入已收录的抖音号"></label><button>查看本地清单</button></form>
<label>TXT 链接清单<input id="txt" type="file" accept=".txt,text/plain"></label>
<form id="text-form" class="input-row"><label>每行一条抖音视频链接<textarea id="links" rows="3"></textarea></label><button>读取链接</button></form>
<form id="local-form" class="input-row"><label>本地视频文件夹<input id="local-path" placeholder="输入完整路径，或从文件夹窗口选取"></label><button id="local" type="button">选择文件夹</button><button type="submit">读取本地视频</button></form>
</div>
</details>
</div>
<div id="picker" hidden>
<form id="start-form">
<div class="two">
<label>主播名称<input id="name" required maxlength="100"></label>
<label>主播账号或本地归类名称<input id="account" required maxlength="180"></label>
</div>
<div class="input-row"><label id="destination-label">保存文件夹<input id="destination" required></label><button id="folder" type="button">选择文件夹</button></div>
<p class="muted" id="catalog-source"></p>
<div class="row list-tools"><label class="check"><input id="all-works" type="checkbox">全选当前结果</label><label class="check"><input id="only-new" type="checkbox">只看新视频</label><select id="sort" aria-label="作品排序"><option value="desc">最新发布</option><option value="asc">最早发布</option><option value="plays">播放量最高</option><option value="likes">点赞最高</option><option value="saves">收藏最高</option></select></div>
<p class="muted sort-note" id="sort-note" role="status" hidden></p>
<div id="works" class="works"></div>
<div class="row"><button type="button" id="previous">上一页</button><span id="page"></span><button type="button" id="next">下一页</button></div>
<label class="check"><input id="compress-downloads" type="checkbox" checked>下载后压缩</label>
<div class="row action"><span id="selection" aria-live="polite"></span><button class="primary" id="start" type="submit">下载所选</button></div>
</form>
</div>
</section>
<section class="panel settings">
<h2>默认方式</h2>
<form id="settings-form" class="stack">
<label>加载主页作品<select id="catalog-tool"><option value="douk">DouK</option><option value="f2">F2</option></select></label>
<label>下载工具<select id="downloader"><option value="douk">DouK</option><option value="f2">F2</option></select></label>
<label>下载后开始转写<select id="auto-transcribe"><option value="false">手动</option><option value="true">自动</option></select></label>
<label id="transcribe-device-setting" hidden>转写设备<select id="transcribe-device" aria-label="转写设备"><option value="cpu">CPU</option><option value="cuda">NVIDIA 显卡加速</option></select></label>
<label>转写后确认入库<select id="auto-import"><option value="false">手动</option><option value="true">自动</option></select></label>
<button type="submit">保存默认方式</button>
</form>
</section>
</div>
<section class="panel batches">
<div class="row heading"><h2>批次进度</h2><select id="batch-list" aria-label="选择批次" hidden></select></div>
<p id="empty">还没有批次。选好视频后，可以在这里看处理进度。</p>
<div id="batch" hidden></div>
</section>
</main>
<dialog id="preview"><div class="row heading"><h2>口播稿</h2><button id="close-preview">关闭</button></div><div id="preview-text"></div></dialog>
</body>
</html>
